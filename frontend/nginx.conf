server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    location = / { try_files /index.html =404; }
    location = /checkin { try_files /checkin.html =404; }
    location = /checkin/ { try_files /checkin.html =404; }
    location = /manager { try_files /manager.html =404; }
    location = /manager/ { try_files /manager.html =404; }

    # Proxy a la API (contenedor con --network host, API en 127.0.0.1:8000). Timeout > 10 s de Athena.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri =404; }
}
