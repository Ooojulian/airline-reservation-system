<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservas aéreas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2712%27 fill=%27%23c8102e%27/%3E%3Cpath transform=%27rotate(45 12 12)%27 fill=%27%23fff%27 d=%27M19 14.8v-1.5l-6-3.8V5.2a1.1 1.1 0 0 0-2.2 0v4.3l-6 3.8v1.5l6-1.9v4l-1.5 1.1v1.1l2.6-.8 2.6.8v-1.1L13 16.9v-4z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span>Reservas aéreas</a>
  <nav><a href="/" aria-current="page">Reservar</a><a href="/manager">Panel gerencial</a></nav>
</header>

<section class="hero">
  <svg class="hero-arc" viewBox="0 0 1200 260" preserveAspectRatio="none" aria-hidden="true">
    <path class="arc-line" d="M-20 240 C 300 20, 820 0, 1220 150"/>
  </svg>
  <div class="hero-inner">
    <h1>¿A dónde vuela hoy?</h1>
    <p>Busque su vuelo, elija silla libre y reciba su código al instante.</p>
  </div>
</section>

<main>
  <form id="search-form" class="search-card" novalidate>
    <div class="route">
      <label class="iata">
        <span class="iata-label">Desde</span>
        <input data-testid="search-origin" id="origin" maxlength="3" placeholder="BOG" autocomplete="off" spellcheck="false" aria-describedby="origin-city">
        <span class="city" id="origin-city">Elija el aeropuerto de salida</span>
      </label>
      <div class="swap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
      <label class="iata">
        <span class="iata-label">Hacia</span>
        <input data-testid="search-destination" id="destination" maxlength="3" placeholder="MDE" autocomplete="off" spellcheck="false" aria-describedby="destination-city">
        <span class="city" id="destination-city">Elija el aeropuerto de llegada</span>
      </label>
    </div>
    <div class="when">
      <label class="field">Fecha de ida<input data-testid="search-date" id="date" type="date"></label>
      <button type="submit" data-testid="search-submit" class="btn-red">Buscar vuelos</button>
    </div>
  </form>

  <p id="search-msg" class="msg" role="status"></p>

  <section class="board" id="board" hidden aria-labelledby="board-title">
    <h2 id="board-title" class="board-title">Salidas</h2>
    <div id="results"></div>
  </section>

  <!-- Panel de reserva: se mueve debajo de la fila elegida -->
  <section class="ticket" id="booking" hidden aria-labelledby="booking-title">
    <h3 id="booking-title">Datos del pasajero, vuelo <span id="booking-flight"></span></h3>
    <form id="booking-form" class="ticket-form">
      <label class="field grow">Nombre completo<input data-testid="passenger-name" id="passenger" maxlength="200" autocomplete="name"></label>
      <label class="field">Tarifa
        <select id="fare"><option value="ECONOMY" selected>Económica</option><option value="BUSINESS">Business (+80 %)</option></select>
      </label>
      <button type="submit" data-testid="confirm-submit" class="btn-red">Confirmar reserva</button>
    </form>
    <p id="booking-msg" class="msg" role="status"></p>
  </section>

  <section class="pass" id="confirmation" hidden aria-live="polite">
    <div class="pass-main">
      <p class="pass-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>Reserva confirmada</p>
      <p class="pass-route"><span id="pass-o"></span><span class="pass-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span><span id="pass-d"></span></p>
      <dl class="pass-meta">
        <div><dt>Pasajero</dt><dd id="pass-name"></dd></div>
        <div><dt>Vuelo</dt><dd id="pass-flight"></dd></div>
        <div><dt>Fecha</dt><dd id="pass-date"></dd></div>
      </dl>
    </div>
    <div class="pass-stub">
      <span>Código de reserva</span>
      <strong data-testid="confirmation-id" id="confirmation-id"></strong>
      <button type="button" class="btn-ghost" id="copy-id">Copiar código</button>
    </div>
  </section>
</main>
<footer class="foot">Proyecto académico de Big Data, Universidad Sergio Arboleda.</footer>
<script src="app.js"></script>
<script>initClient();</script>
</body>
</html>
